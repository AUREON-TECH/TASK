name: Portal protected PWA audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installed app metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          m=json.loads(pathlib.Path('manifest.webmanifest').read_text())
          assert m['name'] and m['short_name'] and m['display']=='standalone'
          assert m['start_url'].startswith('./') and m['scope']=='./'
          for size in (192,512):
            p=pathlib.Path('icon-'+str(size)+'.png')
            b=p.read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',b[16:24])==(size,size)
          assert any('maskable' in i.get('purpose','') for i in m['icons'])
          PY
      - name: Validate protected delivery contract
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const paths=fs.existsSync('app.html')?['index.html','app.html','captacao.html','captacao-resumo.html','captacao-validacao.html']:['index.html'];
          for(const p of paths){
            const html=fs.readFileSync(p,'utf8');
            assert(html.includes('/rest/v1/portal_'),'Missing protected document API: '+p);
            assert(html.includes("cache:'no-store'"),'Private response must not be cached: '+p);
            assert(html.includes("Authorization:'Bearer '+s.access_token"),'Document request must carry session: '+p);
            assert(!html.includes('SUPABASE_SERVICE_ROLE_KEY'),'Server credentials in public shell');
            for(const [,js] of html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g))new vm.Script(js);
          }
          NODE
